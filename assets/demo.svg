    .l { opacity: 0; animation-duration: 11s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .l1 { animation-name: k1 } .l2 { animation-name: k2 } .l3 { animation-name: k3 } .l4 { animation-name: k4 }
    .l5 { animation-name: k5 } .l6 { animation-name: k6 } .l7 { animation-name: k7 } .l8 { animation-name: k8 }
    @keyframes k1 { 0%,2%{opacity:0} 4%,94%{opacity:1} 98%,100%{opacity:0} }
    @keyframes k2 { 0%,9%{opacity:0} 11%,94%{opacity:1} 98%,100%{opacity:0} }
    @keyframes k3 { 0%,16%{opacity:0} 18%,94%{opacity:1} 98%,100%{opacity:0} }
    @keyframes k4 { 0%,23%{opacity:0} 25%,94%{opacity:1} 98%,100%{opacity:0} }
    @keyframes k5 { 0%,32%{opacity:0} 34%,94%{opacity:1} 98%,100%{opacity:0} }
    @keyframes k6 { 0%,39%{opacity:0} 41%,94%{opacity:1} 98%,100%{opacity:0} }
    @keyframes k7 { 0%,46%{opacity:0} 48%,94%{opacity:1} 98%,100%{opacity:0} }
    @keyframes k8 { 0%,53%{opacity:0} 55%,94%{opacity:1} 98%,100%{opacity:0} }
  </style>
