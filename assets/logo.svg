<svg width="760" height="200" viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ui-review">
  <rect width="760" height="200" rx="18" fill="#0F172A"/>

  <!-- desktop frame -->
  <g>
    <rect x="66" y="46" width="158" height="104" rx="10" fill="none" stroke="#38BDF8" stroke-width="5"/>
    <line x1="66" y1="74" x2="224" y2="74" stroke="#38BDF8" stroke-width="4"/>
    <circle cx="82" cy="60" r="4" fill="#38BDF8"/>
    <circle cx="96" cy="60" r="4" fill="#38BDF8"/>
    <!-- content lines: one fits, one overflows the frame -->
    <line x1="84" y1="96" x2="176" y2="96" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <line x1="84" y1="114" x2="204" y2="114" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- phone frame, overlapping -->
  <g>
    <rect x="186" y="84" width="64" height="102" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="5"/>
    <line x1="200" y1="112" x2="236" y2="112" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <!-- overflowing line pokes past the phone edge -->
    <line x1="200" y1="130" x2="272" y2="130" stroke="#F87171" stroke-width="6" stroke-linecap="round"/>
    <line x1="200" y1="148" x2="230" y2="148" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <circle cx="218" cy="170" r="5" fill="#34D399"/>
  </g>

  <!-- wordmark -->
  <text x="312" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#F8FAFC">ui-review</text>
  <text x="315" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#94A3B8">automated UI/UX review for AI coding agents</text>
</svg>
